
<!DOCTYPE html>
<html>
<head>
    <title>Analytics</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="text-center mb-4">

<a href="/analytics"
class="btn btn-success btn-lg px-5 shadow-sm">

📊 View Analytics

</a>

</div>

    <div class="card">
        <div class="card-body">

            <canvas id="studyChart"></canvas>

        </div>
    </div>

</div>

        <a href="/" class="btn btn-primary mb-3">
            🏠 Back to Home
        </a>

<div id="message" class="text-center mt-3"></div>     
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
let logs = JSON.parse(localStorage.getItem("studyLogs")) || [];
console.log(logs);
</script>

<script>

let subjectHours = {};

logs.forEach(function(log){

    if(subjectHours[log.subject]){

        subjectHours[log.subject] +=
            Number(log.hours);

    }
    else{

        subjectHours[log.subject] =
            Number(log.hours);
    }
});

let subjects =
    Object.keys(subjectHours);

let hours =
    Object.values(subjectHours);

let ctx =
    document
    .getElementById("studyChart")
    .getContext("2d");

new Chart(ctx, {

    type: "bar",

    data: {

        labels: subjects,

        datasets: [{
            label: "Study Hours",

            data: hours,
            backgroundColor: [
    '#4e73df',
    '#1cc88a',
    '#36b9cc',
    '#f6c23e',
    '#e74a3b'
],

            borderWidth: 1
        }]
    },

    options: {

        responsive: true,

        scales: {
            y: {
                beginAtZero: true
            }
        }
    }
});
if (logs.length === 0) {
    document.getElementById("message").innerHTML =
        "No study data available. Add some logs first!";
}

</script>

</body>
</html>
