<!DOCTYPE html>
<html>
<head>
    <title>Study Planner</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow p-4">

        <h1 class="text-center mb-4">
            🚀 Study Planner
        </h1>

        <a href="/analytics" class="btn btn-success mb-3">
            📊 View Analytics
        </a>

        <form method="POST" action="/add">

            <div class="mb-3">
                <label class="form-label">Subject</label>
                <input
                    type="text"
                    name="subject"
                    class="form-control"
                    required
                >
            </div>

            <div class="mb-3">
                <label class="form-label">Hours Studied</label>
                <input
                    type="number"
                    name="hours"
                    class="form-control"
                    required
                >
            </div>

            <button class="btn btn-primary">
                Add Study Log
            </button>

        </form>

    </div>

    <div class="card shadow mt-4 p-4">

        <h2>📚 Study Logs</h2>

        <table class="table table-striped mt-3">

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Subject</th>
                    <th>Hours</th>
                </tr>
            </thead>

            <tbody>

                {% for row in logs %}
                <tr>
                    <td>{{ row[0] }}</td>
                    <td>{{ row[1] }}</td>
                    <td>{{ row[2] }}</td>
                </tr>
                {% endfor %}

            </tbody>

        </table>

    </div>

</div>

</body>
</html>
